<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>switchboard — supervision</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>switchboard</h1>
      <div class="controls">
        <label class="mode-control">
          <span>Mode</span>
          <select id="mode-select">
            <option value="manual">manual</option>
            <option value="auto">auto</option>
            <option value="llm" id="mode-llm">llm</option>
          </select>
        </label>
        <button id="settings-btn" class="settings-btn" title="Contracts & policy">⚙ Settings</button>
        <span id="status" class="status status-connecting">connecting…</span>
      </div>
    </header>

    <div id="overlay" class="overlay" hidden></div>

    <main>
      <aside id="sidebar">
        <h2>Agents</h2>
        <ul id="agents"><li class="muted">no agents yet</li></ul>
        <h2>Channels</h2>
        <ul id="channels"><li class="muted">no channels yet</li></ul>
        <div id="new-channel" class="new-channel">
          <input type="text" id="new-channel-name" placeholder="new channel…" />
          <button id="new-channel-btn" title="create channel">+</button>
        </div>
      </aside>

      <section id="feed">
        <div id="channel-header">
          <h2 id="channel-title">Select a channel</h2>
          <div id="channel-meta" class="muted"></div>
        </div>

        <h3 id="pending-heading" hidden>Pending approval</h3>
        <ul id="pending"></ul>

        <ul id="messages"></ul>
        <p id="empty-hint" class="muted">Pick a channel on the left to see its conversation.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
